<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
        
        <!-- PWA Meta Tags -->
        <meta name="theme-color" content="#84cc16" />
        <meta name="description" content="FactuYa! - Crea y gestiona tus facturas de forma rápida y profesional. La manera más fácil de facturar en Colombia." />
        <meta name="application-name" content="FactuYa!" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta name="apple-mobile-web-app-title" content="FactuYa!" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="format-detection" content="telephone=no" />
        <meta name="msapplication-TileColor" content="#84cc16" />
        <meta name="msapplication-tap-highlight" content="no" />
        
        <!-- Favicon and Icons -->
        <link rel="icon" type="image/x-icon" href="%PUBLIC_URL%/favicon.ico" />
        <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32x32.png" />
        <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/favicon-16x16.png" />
        <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png" />
        <link rel="apple-touch-icon" sizes="152x152" href="%PUBLIC_URL%/icon-152.png" />
        <link rel="apple-touch-icon" sizes="167x167" href="%PUBLIC_URL%/icon-167.png" />
        <link rel="apple-touch-icon" sizes="192x192" href="%PUBLIC_URL%/icon-192.png" />
        
        <!-- PWA Manifest -->
        <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
        
        <!-- Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
        
        <!-- iOS Splash Screens -->
        <meta name="apple-touch-startup-image" content="%PUBLIC_URL%/icon-512.png" />
        
        <title>FactuYa! - Facturación Fácil</title>

        <!-- Custom Splash Screen (always shows "FactuYa! - Facturación Fácil" consistently across devices) -->
        <style>
          #factuya-splash {
            position: fixed;
            inset: 0;
            z-index: 99999;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            transition: opacity 0.4s ease-out;
          }
          #factuya-splash.fade-out {
            opacity: 0;
            pointer-events: none;
          }
          #factuya-splash .splash-logo {
            width: 140px;
            height: 140px;
            border-radius: 28px;
            background: #84cc16;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(132, 204, 22, 0.3);
            margin-bottom: 24px;
            overflow: hidden;
          }
          #factuya-splash .splash-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
          }
          #factuya-splash .splash-brand {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
          }
          #factuya-splash .splash-brand-factu {
            font-size: 32px;
            font-weight: 800;
            color: #111827;
            letter-spacing: -0.02em;
          }
          #factuya-splash .splash-brand-ya {
            font-size: 32px;
            font-weight: 800;
            color: #ffffff;
            background: #84cc16;
            padding: 2px 10px;
            margin-left: 4px;
            letter-spacing: -0.02em;
          }
          #factuya-splash .splash-tagline {
            font-size: 16px;
            font-weight: 500;
            color: #6b7280;
            letter-spacing: 0.02em;
          }
          @media (prefers-color-scheme: dark) {
            #factuya-splash { background: #0a0a0a; }
            #factuya-splash .splash-brand-factu { color: #ffffff; }
            #factuya-splash .splash-tagline { color: #9ca3af; }
          }
        </style>
        <script>
          // Hide splash once React has mounted (root has children)
          window.addEventListener('load', function () {
            var attempts = 0;
            var hideSplash = function () {
              var root = document.getElementById('root');
              var splash = document.getElementById('factuya-splash');
              if (root && root.children.length > 0 && splash) {
                splash.classList.add('fade-out');
                setTimeout(function () { splash.remove(); }, 450);
              } else if (attempts++ < 60) {
                setTimeout(hideSplash, 100);
              } else if (splash) {
                splash.classList.add('fade-out');
                setTimeout(function () { splash.remove(); }, 450);
              }
            };
            hideSplash();
          });
        </script>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <!-- Splash screen: always displays brand + tagline consistently across all devices -->
        <div id="factuya-splash" role="status" aria-label="Cargando FactuYa!">
          <div class="splash-logo">
            <img src="%PUBLIC_URL%/icon-512.png" alt="FactuYa!" />
          </div>
          <div class="splash-brand">
            <span class="splash-brand-factu">Factu</span><span class="splash-brand-ya">Ya!</span>
          </div>
          <div class="splash-tagline">Facturación Fácil</div>
        </div>
        <div id="root"></div>
    </body>
</html>
